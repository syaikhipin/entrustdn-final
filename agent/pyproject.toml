[project]
name = "thresh-agent"
version = "0.1.0"
description = "Thresh agent sidecar — LangGraph runtime speaking the Go↔Agent contract"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "langgraph>=0.2",
    "httpx>=0.27",
    "langgraph-checkpoint-postgres>=3.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mcp>=1.2",
    "pytest-asyncio>=1.4.0",
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thresh_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
