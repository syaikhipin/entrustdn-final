# Render Blueprint for Thresh Agent (Python + LangGraph)
# Deploy via: Render Dashboard → New → Blueprint → Connect repo → Select this file

services:
  - type: web
    name: thresh-agent
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -e . && pip install "mcp>=1.2"
    startCommand: uvicorn thresh_agent.app:app --host 0.0.0.0 --port $PORT
    rootDir: agent
    envVars:
      - key: AGENT_HOST
        value: 0.0.0.0
      - key: AGENT_PORT
        value: 10000
      - key: THRESH_MODEL_GATEWAY_BASE_URL
        value: https://inference.hetzner.com/api/v1/
      - key: THRESH_MODEL_GATEWAY_KEY
        sync: false  # Set manually: your Hetzner inference API key
      - key: THRESH_MODEL
        value: Qwen3.8-27B
      - key: HINDSIGHT_API_KEY
        sync: false  # Set manually: your Hindsight API key
