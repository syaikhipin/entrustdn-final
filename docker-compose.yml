services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: thresh
      POSTGRES_PASSWORD: thresh
      POSTGRES_DB: thresh
    ports:
      - "5432:5432"
    volumes:
      - thresh-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thresh"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  thresh-pgdata:
