services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: thresh
      POSTGRES_PASSWORD: thresh
      POSTGRES_DB: thresh
    ports:
      - "5432:5432"
    volumes:
      - thresh-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thresh"]
      interval: 2s
      timeout: 2s
      retries: 15

  # S3-compatible object storage (ADR 0006: server-side only). Dev local
  # stand-in for the self-hosted bucket; the backend is the only client.
  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: thresh
      MINIO_ROOT_PASSWORD: thresh-minio
    ports:
      - "9000:9000"
    volumes:
      - thresh-miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  thresh-pgdata:
  thresh-miniodata:
