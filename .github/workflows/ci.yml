name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Go, race, Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: thresh
          POSTGRES_PASSWORD: thresh
          POSTGRES_DB: thresh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thresh"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://thresh:thresh@localhost:5432/thresh_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Test
        working-directory: backend
        run: go test -race ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...

  agent:
    name: Agent (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Test
        working-directory: agent
        run: |
          uv sync
          uv run pytest tests/ -q

  web:
    name: Web (Nuxt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Test
        working-directory: web
        run: pnpm test
      - name: Build
        working-directory: web
        run: pnpm build
